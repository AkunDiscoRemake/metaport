name: Build MetaPort APK - Cardboard VR

on:
  push:
    branches: [ "arena/01a0ab58-metaport", "main" ]
  workflow_dispatch:

jobs:
  buildNativeAndroid:
    name: Build Native Android COMPLETO 🤖
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK - Manual
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          ls -la $ANDROID_HOME/build-tools/ | head -20

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties

      - name: Setup Gradle 7.6
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6

      - name: Generate Gradle Wrapper
        working-directory: android-native
        run: |
          gradle wrapper --gradle-version 7.6 --distribution-type bin
          chmod +x gradlew

      - name: Build Native APK COMPLETO - Debug
        working-directory: android-native
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          echo "=== FIND APK ==="
          find . -name "*.apk" -type f -ls || echo "No APK"
          ls -R app/build/outputs/ 2>&1 | head -100
          cp /tmp/gradle.log ../GRADLE_BUILD_LOG.txt || true
          cp /tmp/gradle.log ./gradle-build.log || true
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Build failed"
            tail -100 /tmp/gradle.log
            exit $EXIT_CODE
          fi
          if [ -z "$(find . -name "*.apk" -type f)" ]; then
            echo "No APK found!"
            exit 1
          fi

      - name: Upload Gradle Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: /tmp/gradle.log

      - name: Upload APK COMPLETO
        uses: actions/upload-artifact@v4
        with:
          name: MetaPort-Native-APK
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit log
        if: always()
        run: |
          cp /tmp/gradle.log ./GRADLE_BUILD_LOG.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GRADLE_BUILD_LOG.txt android-native/gradle-build.log || true
          git commit -m "CI: Add gradle log [skip ci]" || true
          git push origin HEAD:arena/01a0ab58-metaport || true
        continue-on-error: true

  release:
    name: Create Release 🚀 COMPLETO
    runs-on: ubuntu-latest
    needs: buildNativeAndroid
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MetaPort-Native-APK
          path: ./release/

      - name: Create Release COMPLETO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2-complete-${{ github.run_number }}
          name: MetaPort v2.2 COMPLETO - 9 Ambientes + 12 Jogos + 6DOF + Hand Tracking (Build ${{ github.run_number }})
          body: |
            ## MetaPort v2.2 COMPLETO - Melhor App VR Box do Mundo
            
            ### ✅ COMPLETO com:
            - 6DOF SLAM via ARCore (VIO) - anda de verdade no Cardboard
            - Hand Tracking MediaPipe 21 landmarks por mão (2 mãos)
            - Cardboard VR stereo + distortion
            - UI 100% 3D Spatial com profundidade real (proibido 2D)
            - 9 Ambientes 3D: Tropical Island, CyberCity neon, SpaceStation, Forest Valley, Nebula Void, Void, Japanese Dojo, Desert Oasis, Passthrough
            - 12 Jogos Quest remake: Beat Saber (sabres nas mãos), Pong Spatial, Fishing VR, Mini Golf, Smash Drums, Superhot VR (tempo anda quando você anda - 6DOF), Asgard's Wrath, Gorilla Tag, Job Simulator, Tetris 3D, Puzzling Places, First Steps
            - Mixed Reality com câmera + depth occlusion
            - OpenXR via Monado
            - Dev API
            
            ### 📱 Instala:
            1. Baixa app-debug.apk abaixo
            2. Instala no Android
            3. Coloca no Cardboard VR Box
            
            ### 🎮 Controles:
            - Gaze + botão Cardboard
            - Mãos na frente da câmera: Pinch (dedão+indicador) = grab/click, mão aberta = menu, apontar = laser
            - Toque duplo na tela = troca VR/MR/Passthrough
            
            Build automático via GitHub Actions - sem Unity local!
            Commit: ${{ github.sha }}
          files: |
            release/**/*.apk
            MetaPort_CardboardVR_SDK_v1.0.unitypackage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
