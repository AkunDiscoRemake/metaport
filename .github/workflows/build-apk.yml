name: MetaPort APK

on:
  push:
    branches:
      - "arena/01a0ad37-metaport"
      - "main"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MetaPort APK (Cardboard VR + ARCore 6DOF)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept licenses + install SDK pieces
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Generate Gradle wrapper (7.6.4)
        run: |
          gradle wrapper --gradle-version 7.6.4 --distribution-type bin --no-daemon
          chmod +x gradlew

      - name: Compile + assemble APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          echo "=== APKs ==="
          find app/build/outputs -name '*.apk' -type f -exec ls -lh {} \;

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaPort-XR-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MetaPort-XR-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.ref == 'refs/heads/arena/01a0ad37-metaport'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MetaPort-XR-debug-APK
          path: ./out/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MetaPort XR build ${{ github.run_number }}
          body: |
            Native Android spatial VR/MR build from `${{ github.sha }}`.

            - Cardboard stereo pipeline (official Google viewer optics + lens distortion)
            - ARCore 6DOF SLAM, plane/anchor/depth tracking, camera passthrough MR
            - Hand tracking, spatial 3D UI, procedural environments, games, Dev API
          files: out/*.apk
          fail_on_unmatched_files: false
